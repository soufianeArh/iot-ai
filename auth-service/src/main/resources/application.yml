server:
  port: 8080

spring:
  application:
    name: auth-service
  datasource:
    ## overridden by SPRING_DATASOURCE_URL env var
    url: jdbc:postgresql://localhost:5434/myiot
    username: postgres
    password: devpass
  jpa:
    hibernate:
      # Flyway owns the schema (V1__create_user.sql), this only checks the
      # entity matches, same convention as device-service
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate.format_sql: true
      hibernate.default_schema: auth
  flyway:
    enabled: true
    locations: classpath:db/migration
    # own schema, sits next to device-service's `public` and video-service's
    # `video` and ai-service's `ai`. create-schemas defaults to true, so this
    # gets created on first boot rather than needing a manual step.
    schemas: auth
    default-schema: auth

jwt:
  # overridden by JWT_SECRET env var, must stay identical across every
  # service that verifies the token, not just the one that issues it
  secret: dev-only-secret-change-me-before-anything-real-CHANGE-ME
  expiration-minutes: 720

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
