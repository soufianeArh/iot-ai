server:
  port: 8080

spring:
  application:
    name: device-service
  datasource:
    # Pass A (IDE): host port from your compose is 5434
    # Pass B (Docker): overridden by SPRING_DATASOURCE_URL env var
    url: jdbc:postgresql://localhost:5434/myiot
    username: postgres
    password: devpass
  jpa:
    hibernate:
      ddl-auto: validate    # Flyway owns the schema; fail fast if entity drifts
    open-in-view: false
    show-sql: true
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

# Phase 4: MQTT ingest. Overridden in Docker by MQTT_BROKER_URL.
mqtt:
  broker-url: tcp://localhost:1883
  client-id: device-service
  properties-topic: iot/+/+/properties
  status-topic: iot/+/+/status
  qos: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace
