server:
  port: 8080

spring:
  application:
    name: device-service
  datasource:
    ## overridden by SPRING_DATASOURCE_URL env var
    ## no problem in prod url
    url: jdbc:postgresql://localhost:5434/myiot
    username: postgres
    password: devpass
  jpa:
    hibernate:
      # Flyway creates schema creates the schema from its own SQL files
      # (V1__create_device.sql, V2__create_device_property.sql)
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

# Verifies the JWT auth-service issues, must match its secret exactly
jwt:
  secret: dev-only-secret-change-me-before-anything-real-CHANGE-ME

# Where to ship audit rows, overridden by AUTH_SERVICE_URL in compose; blank
# here so a bare local run without the full stack just skips reporting.
audit:
  auth-service-url: ${AUTH_SERVICE_URL:}

# p4 MqttProps bean in SB declaration takes constructor data from here
mqtt:
  broker-url: tcp://localhost:1883
  client-id: device-service
  properties-topic: iot/+/+/properties
  status-topic: iot/+/+/status
  qos: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace
