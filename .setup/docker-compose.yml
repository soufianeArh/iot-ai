services:
  # PostgresSQL Server
  PostgresSQL:
    image: postgres:18
    container_name: postgres-server
    restart: always
    ports:
      - "0.0.0.0:5434:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data:rw
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - easyaiot-network
  # Redis Server
  Redis:
    image: redis:7.4.8
    container_name: redis-server
    restart: always
    ports:
      - "0.0.0.0:6379:6379"
    command: >
      redis-server
      --save 60 1000
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --timeout 300
    volumes:
      - redisdata:/data:rw
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20M"
        max-file: "10"
    networks:
      - easyaiot-network
  # EMQX MQTT broker (Phase 4) - dashboard on http://localhost:18083
  EMQX:
    image: emqx/emqx:5.8.7
    container_name: emqx-server
    restart: always
    ports:
      - "1883:1883"    # MQTT
      - "18083:18083"  # Dashboard
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=127.0.0.1
      - EMQX_NODE__COOKIE=devcookie
      - EMQX_DASHBOARD__DEFAULT_USERNAME=admin
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_DASHBOARD_PASSWORD}
      - EMQX_LOG__LEVEL=warning
    volumes:
      - emqx_data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 25s
      retries: 5
    networks:
      - easyaiot-network

  # Device Service (Spring Boot) - built from ../device-service
  device-service:
    build:
      context: ../device-service
    container_name: device-service
    restart: always
    depends_on:
      PostgresSQL:
        condition: service_healthy
      EMQX:
        condition: service_healthy
    # Phase 3: no host port. Reachable only inside the network, via nginx.
    expose:
      - "8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://PostgresSQL:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - MQTT_BROKER_URL=tcp://EMQX:1883
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - easyaiot-network

  # MediaMTX media server (Phase 6): RTSP in -> HLS/WebRTC out
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: always
    volumes:
      - ../media/mediamtx.yml:/mediamtx.yml:ro
    ports:
      # WebRTC needs a real UDP path back to the browser; the others are
      # reached through nginx only.
      - "8189:8189/udp"
    expose:
      - "8554"   # RTSP
      - "8888"   # HLS
      - "8889"   # WebRTC/WHEP
      - "9997"   # control API
    networks:
      - easyaiot-network

  # Video Service (Python/Flask) - camera registry, Phase 5
  video-service:
    build:
      context: ../video-service
    container_name: video-service
    restart: always
    depends_on:
      PostgresSQL:
        condition: service_healthy
    expose:
      - "6000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@PostgresSQL:5432/${POSTGRES_DB}
      - DEVICE_SERVICE_URL=http://device-service:8080
      - MEDIA_SERVER_API=http://mediamtx:9997
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6000/video/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - easyaiot-network

  # A fake IoT device, the MQTT-side mirror of the fake cameras: publishes
  # temperature, humidity and soil moisture on a loop so the devices page shows
  # live data rather than whatever was last sent by hand.
  #
  # It publishes as an EXISTING device (pk-test / C900 = sensor-01).
  # device-service drops messages from a device it does not know, which is
  # correct - so if this ever appears to do nothing, check the device exists
  # before suspecting the broker.
  sample-device:
    build:
      context: ../sample-device
    container_name: sample-device
    restart: always
    depends_on:
      EMQX:
        condition: service_healthy
    environment:
      - MQTT_HOST=EMQX
      - PRODUCT_KEY=pk-test
      - DEVICE_CODE=C900
      - PUBLISH_INTERVAL_SECONDS=20
      # A day per hour. At 600 the "last hour" chart showed six identical
      # humps, which is what made the data look synthetic; at 3600 it shows
      # one cycle, and the weather drift makes each day differ from the last.
      - DAY_SECONDS=3600
    networks:
      - easyaiot-network

  # A second sensor, in a greenhouse: same image, different device code.
  #
  # Warmer, damper, and a quarter-cycle ahead of the field sensor. Identical
  # readings on two devices would look like one value written to two rows -
  # and would hide the real bug where it actually was.
  sample-device-2:
    build:
      context: ../sample-device
    container_name: sample-device-2
    restart: always
    depends_on:
      EMQX:
        condition: service_healthy
    environment:
      - MQTT_HOST=EMQX
      - PRODUCT_KEY=pk-test
      - DEVICE_CODE=G210
      - PUBLISH_INTERVAL_SECONDS=20
      - DAY_SECONDS=3600
      - PHASE_OFFSET_SECONDS=900     # a quarter of the cycle ahead
      - TEMP_BIAS=4.5                # under glass, so warmer
      - HUMIDITY_BIAS=12             # and damper
    networks:
      - easyaiot-network

  # ---- Phase 7: fake cameras, so YOLO has something real to detect ----
  # This is the cameras' own RTSP server, and it is SHARED: drone-camera
  # publishes to /drone and land-camera to /land on this one server. Point a
  # real camera URL at video-service instead and none of this is needed -
  # nothing downstream knows the difference.
  sample-camera-rtsp:
    image: bluenviron/mediamtx:latest
    container_name: sample-camera-rtsp
    restart: always
    expose:
      - "8554"
    networks:
      - easyaiot-network

  # The original /live publisher (YOLO's bus.jpg and zidane.jpg) was removed
  # once cameras 4 and 5 covered the same ground with better content. To bring
  # it back: restore a service built from the sample-camera directory with
  # RTSP_TARGET pointing at .../live, then re-register the camera with
  #   POST /video/camera  {"name":"sample-cam","rtspUrl":"rtsp://...:8554/live"}
  #
  # NOTE what is deliberately NOT removed:
  #   * sample-camera-rtsp - one server, three paths (/live, /drone, /land).
  #     Deleting it would take cameras 4 and 5 down with it.
  #   * the sample-camera directory - it is the build context for drone-camera
  #     and land-camera too.

  # A second fake camera: synthetic drone frames of a crop fire and a flooded
  # field. Same image as sample-camera - publish.sh takes its destination from
  # RTSP_TARGET and its content from /samples, so a different camera is a
  # different env var and a different volume, not a different build.
  #
  # One RTSP server hosts both: sample-camera-rtsp serves /live and /drone.
  #
  # Note these frames detect nothing under COCO weights - there is no "fire"
  # or "flood" class. They are here for a custom-trained model later.
  drone-camera:
    build:
      context: ../sample-camera
    container_name: drone-camera
    restart: always
    depends_on:
      - sample-camera-rtsp
    # Mounted, not baked in: the images can be regenerated without a rebuild.
    # This shadows the playlist.txt the Dockerfile copied in, which is why the
    # drone playlist has to live in the mounted directory.
    volumes:
      - ../samples/drone:/samples:ro
    environment:
      - RTSP_TARGET=rtsp://sample-camera-rtsp:8554/drone
      # The two source photos are 611x342 and 368x468 - one landscape, one
      # portrait. concat refuses mixed sizes, so both are letterboxed onto a
      # 4:3 canvas, which wastes fewer pixels on either than 16:9 would.
      - OUT_SIZE=960x720
    networks:
      - easyaiot-network

  # A third fake camera: farm stills - birds, a cow, a fire, people. Same
  # image and same publish script as the others; only the volume and the
  # RTSP path differ. One RTSP server hosts /live, /drone and /land.
  land-camera:
    build:
      context: ../sample-camera
    container_name: land-camera
    restart: always
    depends_on:
      - sample-camera-rtsp
    volumes:
      - ../samples/land:/samples:ro
    environment:
      - RTSP_TARGET=rtsp://sample-camera-rtsp:8554/land
    networks:
      - easyaiot-network

  # A fourth fake camera: leaf close-ups for the plant-disease model.
  #
  # Honest about what this is: disease detection needs a leaf filling the
  # frame, which no field camera provides - the lesions are millimetres across
  # and simply are not in a wide shot. Treat this camera as an inspection
  # bench rather than surveillance; the natural production shape is someone
  # photographing a suspect leaf and uploading it.
  plant-camera:
    build:
      context: ../sample-camera
    container_name: plant-camera
    restart: always
    depends_on:
      - sample-camera-rtsp
    volumes:
      - ../samples/plant:/samples:ro
    environment:
      - RTSP_TARGET=rtsp://sample-camera-rtsp:8554/plant
    networks:
      - easyaiot-network

  # ---- Phase 8b: local LLM runtime for the chat assistant ----
  # Ollama is the SERVER; the model is pulled into it separately and lives in
  # the named volume:
  #     docker exec ollama ollama pull qwen2.5:1.5b
  # Without the volume that download repeats on every recreate.
  #
  # It speaks the OpenAI /v1/chat/completions API, so ai-service can be pointed
  # at Groq/OpenAI/Anthropic instead by changing LLM_BASE_URL alone.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    # NOT "always": this host cannot afford a local model alongside the stack,
    # so the chat runs on a hosted API and this service is opt-in. With
    # restart: always it came back on every Docker restart and quietly ate the
    # memory that was the reason for switching away from it.
    # Start it deliberately: docker compose up -d ollama
    restart: "no"
    expose:
      - "11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      # Unload the model after 5 minutes idle. Memory here is tight and the
      # chat is used in bursts; a reload costs a few seconds.
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    # Same reasoning as ai-service: inference must never starve the healthchecks.
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - easyaiot-network

  # AI Service (Python) - YOLO inference workers
  ai-service:
    build:
      context: ../ai-service
    container_name: ai-service
    restart: always
    depends_on:
      PostgresSQL:
        condition: service_healthy
    expose:
      - "7000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@PostgresSQL:5432/${POSTGRES_DB}
      - VIDEO_SERVICE_URL=http://video-service:6000
      - MEDIA_RTSP_BASE=rtsp://mediamtx:8554
      - SNAPSHOT_DIR=/snapshots
      - SAMPLE_INTERVAL_SECONDS=3
      # Measured, not guessed. On the sample camera real detections cluster
      # high (bus 0.88-0.89, person median 0.83) while the false positives on
      # content COCO has no class for sit at 0.43-0.63. 0.65 lands in the gap:
      #   0.60 -> keeps 80% of person, 100% of bus, but a junk "cat" at 0.627
      #           still gets through
      #   0.65 -> keeps 79% of person, 100% of bus, and that cat is filtered
      # One point of recall buys the removal of the worst false positive.
      - MIN_CONFIDENCE=0.65
      - TORCH_THREADS=2
      - OMP_NUM_THREADS=2
      # Named weight sets. The default is COCO (person, bus, ...) which has no
      # fire class; "fire" detects fire and smoke and nothing else. A task
      # picks one: POST /ai/tasks/4?model=fire
      - YOLO_EXTRA_MODELS=fire=/models/fire.pt
      # A transformers detection model, not Ultralytics weights: leaf disease
      # is only published in that form. 30 PlantDoc classes - see
      # models/plant-disease/README.md for what it can and cannot tell apart.
      - HF_MODELS=plant=/models/plant-disease
      # Per-model confidence floors. The plant model scores a genuine tomato
      # blight at 0.569, which the global 0.65 would throw away before any rule
      # saw it; the rules then filter properly with their own thresholds.
      - MODEL_CONFIDENCE=plant=0.40
      # Tasks live in memory, so nothing analyses anything after a restart
      # until someone POSTs. This starts the ones that should always be on.
      # Format: "cameraId:model[,model]" entries separated by ';'.
      # Cameras 3 and 4 stay idle deliberately - they are for comparing
      # against camera 5 by hand, not for burning CPU permanently.
      - AUTOSTART_TASKS=5:default,fire
      # Phase 8b - chat. Provider-agnostic: any OpenAI-compatible endpoint.
      # Hosted (Groq) because this host has 8 GB of RAM: a local model and the
      # rest of the stack together exhaust the WSL2 VM and wedge the engine.
      # To go back to fully-offline, uncomment the ollama service below and
      # swap these three lines - no code changes.
      - DEVICE_SERVICE_URL=http://device-service:8080
      - LLM_BASE_URL=https://api.groq.com/openai/v1
      # Must support tool calling. gpt-oss-20b is the fast one on Groq that
      # does; llama-3.3-70b-versatile was retired and 404s.
      - LLM_MODEL=openai/gpt-oss-20b
      - LLM_API_KEY=${GROQ_API_KEY}
      #   local alternative (needs >=6 GB for Docker):
      #   - LLM_BASE_URL=http://ollama:11434/v1
      #   - LLM_MODEL=qwen2.5:1.5b
      #   - LLM_API_KEY=ollama-needs-no-key
    # A hard ceiling as well as the thread cap: inference must never be able to
    # starve the media server or the health checks. Raised from 2 to 4 (of 8)
    # once the Docker Desktop Kubernetes control plane was turned off - three
    # cameras running side by side for comparison need more than two cores.
    cpus: 4.0
    volumes:
      - snapshots:/snapshots
      # Third-party weights, mounted rather than baked in: they are large, they
      # are not ours, and swapping them should not need a rebuild. See
      # models/README.md for where fire.pt came from and how it was audited.
      - ../models:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7000/ai/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - easyaiot-network

  # Nginx - the single front door (Phase 3)
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: always
    depends_on:
      device-service:
        condition: service_healthy
      video-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ../web/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Phase 9: the built Vue app is what "/" serves. Built on the host with
      # `npm run build` in frontend/ - there is no Node in production, nginx
      # just serves the static output.
      - ../web/dist:/usr/share/nginx/app:ro
      # The hand-written pages, now at /legacy/. Kept until the Vue app has
      # replaced all of them; delete this line and web/html together.
      - ../web/html:/usr/share/nginx/legacy:ro
      # Python writes the annotated frames, nginx serves them. Read-only here so
      # the web tier can never modify what the AI tier produced.
      - snapshots:/usr/share/nginx/snapshots:ro
    healthcheck:
      # 127.0.0.1 not localhost: localhost resolves to [::1] in this image and
      # nginx `listen 80` binds IPv4 only -> the check would always fail.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - easyaiot-network

volumes:
  snapshots:
  ollama:
  pgdata:
  redisdata:
  emqx_data:

networks:
  easyaiot-network: