services:
  # PostgresSQL Server
  PostgresSQL:
    image: postgres:18
    restart: always
    # pinned so a shared host's nvidia default runtime does not hijack this
    runtime: runc
    ports:
      - "0.0.0.0:5434:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data:rw
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - easyaiot-network
  # Redis Server
  Redis:
    image: redis:7.4.8
    restart: always
    # pinned so a shared host's nvidia default runtime does not hijack this
    runtime: runc
    ports:
      - "0.0.0.0:6379:6379"
    command: >
      redis-server
      --save 60 1000
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --timeout 300
    volumes:
      - redisdata:/data:rw
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20M"
        max-file: "10"
    networks:
      - easyaiot-network
  # EMQX MQTT broker (Phase 4) - dashboard on http://localhost:18083
  EMQX:
    image: emqx/emqx:5.8.7
    restart: always
    # pinned so a shared host's nvidia default runtime does not hijack this
    runtime: runc
    ports:
      - "1883:1883"    # MQTT
      - "18083:18083"  # Dashboard
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=127.0.0.1
      - EMQX_NODE__COOKIE=devcookie
      - EMQX_DASHBOARD__DEFAULT_USERNAME=admin
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_DASHBOARD_PASSWORD}
      - EMQX_LOG__LEVEL=warning
    volumes:
      - emqx_data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 25s
      retries: 5
    networks:
      - easyaiot-network

  # Device Service (Spring Boot) - built from ../device-service
  device-service:
    build:
      context: ../device-service
    restart: always
    # pinned so a shared host's nvidia default runtime does not hijack this
    runtime: runc
    depends_on:
      PostgresSQL:
        condition: service_healthy
      EMQX:
        condition: service_healthy
    # Phase 3: no host port. Reachable only inside the network, via nginx.
    expose:
      - "8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://PostgresSQL:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - MQTT_BROKER_URL=tcp://EMQX:1883
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - easyaiot-network

  # MediaMTX media server (Phase 6): RTSP in -> HLS/WebRTC out
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: always
    # pinned so a shared host's nvidia default runtime does not hijack this
    runtime: runc
    volumes:
      - ../media/mediamtx.yml:/mediamtx.yml:ro
    ports:
      # WebRTC needs a real UDP path back to the browser; the others are
      # reached through nginx only.
      - "8189:8189/udp"
    expose:
      - "8554"   # RTSP
      - "8888"   # HLS
      - "8889"   # WebRTC/WHEP
      - "9997"   # control API
    networks:
      - easyaiot-network

  # Video Service (Python/Flask) - camera registry, Phase 5
  video-service:
    build:
      context: ../video-service
    restart: always
    # pinned so a shared host's nvidia default runtime does not hijack this
    runtime: runc
    depends_on:
      PostgresSQL:
        condition: service_healthy
    expose:
      - "6000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@PostgresSQL:5432/${POSTGRES_DB}
      - DEVICE_SERVICE_URL=http://device-service:8080
      - MEDIA_SERVER_API=http://mediamtx:9997
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6000/video/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - easyaiot-network

  # Fake IoT device: publishes temperature, humidity and soil moisture on a
  # loop so the devices page has live data. Publishes as pk-test/C900, which
  # must already be registered, or device-service just drops the messages.
  sample-device:
    build:
      context: ../sample-device
    restart: always
    # pinned so a shared host's nvidia default runtime does not hijack this
    runtime: runc
    depends_on:
      EMQX:
        condition: service_healthy
    environment:
      - MQTT_HOST=EMQX
      - PRODUCT_KEY=pk-test
      - DEVICE_CODE=C900
      - PUBLISH_INTERVAL_SECONDS=20
      # A day per hour. At 600 the "last hour" chart showed six identical
      # humps, which is what made the data look synthetic; at 3600 it shows
      # one cycle, and the weather drift makes each day differ from the last.
      - DAY_SECONDS=3600
    networks:
      - easyaiot-network

  # A second sensor, in a greenhouse: same image, different device code and
  # bias, so it doesn't just mirror the field sensor's readings.
  sample-device-2:
    build:
      context: ../sample-device
    restart: always
    # pinned so a shared host's nvidia default runtime does not hijack this
    runtime: runc
    depends_on:
      EMQX:
        condition: service_healthy
    environment:
      - MQTT_HOST=EMQX
      - PRODUCT_KEY=pk-test
      - DEVICE_CODE=G210
      - PUBLISH_INTERVAL_SECONDS=20
      - DAY_SECONDS=3600
      - PHASE_OFFSET_SECONDS=900     # a quarter of the cycle ahead
      - TEMP_BIAS=4.5                # under glass, so warmer
      - HUMIDITY_BIAS=12             # and damper
    networks:
      - easyaiot-network

  # Shared RTSP server for the sample cameras below: drone-camera publishes
  # to /drone, land-camera to /land. A real camera would just point at
  # video-service instead, with nothing downstream needing to change.
  sample-camera-rtsp:
    image: bluenviron/mediamtx:latest
    restart: always
    # pinned so a shared host's nvidia default runtime does not hijack this
    runtime: runc
    expose:
      - "8554"
    networks:
      - easyaiot-network

  # A second fake camera: synthetic drone frames of a crop fire and a flooded
  # field. Same image as sample-camera, just a different RTSP_TARGET and a
  # different /samples volume. COCO weights won't detect fire or flood; these
  # frames are here for a custom-trained model later.
  drone-camera:
    build:
      context: ../sample-camera
    restart: always
    # pinned so a shared host's nvidia default runtime does not hijack this
    runtime: runc
    depends_on:
      - sample-camera-rtsp
    # Mounted, not baked in: the images can be regenerated without a rebuild.
    # This shadows the playlist.txt the Dockerfile copied in, which is why the
    # drone playlist has to live in the mounted directory.
    volumes:
      - ../samples/drone:/samples:ro
    environment:
      - RTSP_TARGET=rtsp://sample-camera-rtsp:8554/drone
      # The two source photos are 611x342 and 368x468 - one landscape, one
      # portrait. concat refuses mixed sizes, so both are letterboxed onto a
      # 4:3 canvas, which wastes fewer pixels on either than 16:9 would.
      - OUT_SIZE=960x720
    networks:
      - easyaiot-network

  # A third fake camera: farm stills including birds, a cow, a fire, people.
  # Same image and script as the others, just a different volume and path.
  land-camera:
    build:
      context: ../sample-camera
    restart: always
    # pinned so a shared host's nvidia default runtime does not hijack this
    runtime: runc
    depends_on:
      - sample-camera-rtsp
    volumes:
      - ../samples/land:/samples:ro
    environment:
      - RTSP_TARGET=rtsp://sample-camera-rtsp:8554/land
    networks:
      - easyaiot-network

  # A fourth fake camera: leaf close-ups for the plant-disease model, which
  # needs a leaf filling the frame rather than a wide surveillance shot.
  plant-camera:
    build:
      context: ../sample-camera
    restart: always
    # pinned so a shared host's nvidia default runtime does not hijack this
    runtime: runc
    depends_on:
      - sample-camera-rtsp
    volumes:
      - ../samples/plant:/samples:ro
    environment:
      - RTSP_TARGET=rtsp://sample-camera-rtsp:8554/plant
    networks:
      - easyaiot-network

  # Local LLM runtime for the chat assistant. Ollama is just the server; pull
  # a model into it separately (docker exec ollama ollama pull qwen2.5:1.5b),
  # kept in the named volume below so it survives a recreate.
  ollama:
    image: ollama/ollama:latest
    # Opt-in only: this host can't run a local model alongside the rest of
    # the stack, so chat defaults to a hosted API instead.
    restart: "no"
    # pinned so a shared host's nvidia default runtime does not hijack this
    runtime: runc
    expose:
      - "11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      # Unload the model after 5 minutes idle. Memory here is tight and the
      # chat is used in bursts; a reload costs a few seconds.
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    # Capped so it can't starve the rest of the stack, but this is CPU
    # inference, so a bigger deploy target should raise OLLAMA_CPUS.
    cpus: ${OLLAMA_CPUS:-2.0}
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - easyaiot-network

  # Loads the model into memory as soon as ollama is healthy, so the first
  # real chat request isn't the one paying the cold-load cost. Opt-in, same
  # as ollama: docker compose up -d ollama-warmup.
  ollama-warmup:
    image: ollama/ollama:latest
    restart: "no"
    runtime: runc
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:1.5b}
    entrypoint: ["sh", "-c", "ollama run \"$$LLM_MODEL\" 'reply with OK' || true"]
    networks:
      - easyaiot-network

  # AI Service (Python) - YOLO inference workers
  ai-service:
    build:
      context: ../ai-service
    restart: always
    # pinned so a shared host's nvidia default runtime does not hijack this
    runtime: runc
    depends_on:
      PostgresSQL:
        condition: service_healthy
    expose:
      - "7000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@PostgresSQL:5432/${POSTGRES_DB}
      - VIDEO_SERVICE_URL=http://video-service:6000
      - MEDIA_RTSP_BASE=rtsp://mediamtx:8554
      - SNAPSHOT_DIR=/snapshots
      - SAMPLE_INTERVAL_SECONDS=3
      # Tuned against the sample cameras: high enough to filter obvious false
      # positives, low enough to keep most real person/bus detections.
      - MIN_CONFIDENCE=0.65
      - TORCH_THREADS=2
      - OMP_NUM_THREADS=2
      # Extra named weight sets on top of the COCO default: fire detects fire
      # and smoke only. Pick one per task: POST /ai/tasks/4?model=fire
      - YOLO_EXTRA_MODELS=fire=/models/fire.pt
      # A transformers model, not Ultralytics weights, since that's the only
      # form the leaf disease model is published in. See
      # models/plant-disease/README.md for what it can tell apart.
      - HF_MODELS=plant=/models/plant-disease
      # Per-model confidence floor: the plant model runs lower than the
      # global MIN_CONFIDENCE so real disease hits aren't dropped early.
      - MODEL_CONFIDENCE=plant=0.40
      # Tasks live in memory only, so nothing runs after a restart until this
      # starts it back up. Format: "cameraId:model[,model]" separated by ';'.
      - AUTOSTART_TASKS=5:default,fire
      # Chat assistant, provider-agnostic over any OpenAI-compatible endpoint.
      - DEVICE_SERVICE_URL=http://device-service:8080
      # Defaults to the hosted Groq API; override these three in a deploy's
      # own .env to point at a different provider or the local ollama service.
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      # Must support tool calling.
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-20b}
      - LLM_API_KEY=${LLM_API_KEY:-${GROQ_API_KEY}}
      # Matches llm_client.py's own default; raise it in a deploy's .env for
      # a slower local model.
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-120}
    # Caps inference so it can't starve the media server or health checks.
    cpus: 4.0
    volumes:
      - snapshots:/snapshots
      # Third-party weights, mounted rather than baked in so swapping them
      # doesn't need a rebuild. See models/README.md for provenance.
      - ../models:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7000/ai/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - easyaiot-network

  # Nightly DB retention and backup, two independent cron jobs. See
  # ../ops/README.md for what each does.
  maintenance:
    build:
      context: ../ops
    restart: always
    # pinned so a shared host's nvidia default runtime does not hijack this
    runtime: runc
    depends_on:
      PostgresSQL:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@PostgresSQL:5432/${POSTGRES_DB}
      - SNAPSHOT_DIR=/snapshots
      - BACKUP_DIR=/backups
      - RETENTION_DAYS=30
      - MAX_DETECTIONS_PER_CAMERA=500
      - BACKUP_DAILY_KEEP=7
      - BACKUP_WEEKLY_KEEP=4
      - BACKUP_MONTHLY_KEEP=12
    volumes:
      # Read-write: retention.py deletes files here for detections it purges.
      - snapshots:/snapshots
      # Bind mount, not a named volume, so backups are easy to scp/rsync off
      # the host by hand.
      - ../backups:/backups
    networks:
      - easyaiot-network

  # Nginx - the single front door (Phase 3)
  nginx:
    image: nginx:1.27-alpine
    restart: always
    # pinned so a shared host's nvidia default runtime does not hijack this
    runtime: runc
    depends_on:
      device-service:
        condition: service_healthy
      video-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      # Configurable in case a deploy target already has something on 80;
      # defaults to 80 so local dev is unaffected.
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ../web/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Never committed - generated per-deploy, see .gitignore.
      - ../web/conf/.htpasswd:/etc/nginx/.htpasswd:ro
      # The built Vue app, from `npm run build` in frontend/. No Node in
      # production, nginx just serves the static output.
      - ../web/dist:/usr/share/nginx/app:ro
      # Older hand-written pages at /legacy/, kept until the Vue app fully
      # replaces them.
      - ../web/html:/usr/share/nginx/legacy:ro
      # Read-only: nginx serves the frames ai-service writes, never edits them.
      - snapshots:/usr/share/nginx/snapshots:ro
    healthcheck:
      # 127.0.0.1 not localhost: localhost resolves to [::1] in this image and
      # nginx `listen 80` binds IPv4 only -> the check would always fail.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - easyaiot-network

volumes:
  snapshots:
  ollama:
  pgdata:
  redisdata:
  emqx_data:

networks:
  easyaiot-network: