# Mounted at /etc/nginx/conf.d/default.conf
# Only the server block: the base image already provides the http{} wrapper.

server {
    listen 80;
    server_name localhost;

    # ---- shared proxy headers (see EasyAIoT WEB/conf/nginx.edge.conf:50-57) ----
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    client_max_body_size 20M;

    # Docker's embedded DNS. Without this, nginx resolves upstream names ONCE at
    # startup and caches the IP forever -> 502 after any container is recreated.
    # Pairing it with a variable in proxy_pass defers resolution to request time.
    # (EasyAIoT does the same: WEB/conf/nginx.edge.conf:71 and :346)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $device_upstream device-service:8080;
    set $video_upstream  video-service:6000;
    set $hls_upstream    mediamtx:8888;
    set $whep_upstream   mediamtx:8889;
    set $ai_upstream     ai-service:7000;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # ---- API: no trailing slash on proxy_pass, so /api/devices stays /api/devices ----
    location ^~ /api/ {
        proxy_pass http://$device_upstream;
    }

    # ---- Actuator (health/info) ----
    location ^~ /actuator/ {
        proxy_pass http://$device_upstream;
    }

    # ---- Python video-service (Phase 5) ----
    location ^~ /video/ {
        proxy_pass http://$video_upstream;
    }

    # ---- Python ai-service (Phase 7) ----
    location ^~ /ai/ {
        proxy_pass http://$ai_upstream;
        # inference calls can be slow; do not cut them off at the default 60s
        proxy_read_timeout 180s;
    }

    # ---- annotated frames written by ai-service (Phase 7) ----
    # Served straight off the shared volume: nginx handles the bytes, Python
    # never touches them - the same split used for video.
    location ^~ /snapshots/ {
        alias /usr/share/nginx/snapshots/;
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- HLS playback (Phase 6) ----
    # The .m3u8 playlist is rewritten every second; caching it breaks playback.
    location ^~ /hls/ {
        # A trailing slash on proxy_pass normally strips the matched prefix -
        # but that does NOT happen when proxy_pass contains a variable. With a
        # variable the original URI is passed through untouched, so the prefix
        # must be removed explicitly with rewrite.
        rewrite ^/hls/(.*)$ /$1 break;
        proxy_pass http://$hls_upstream;
        # MediaMTX answers the first request with a 302 to set a session cookie.
        # That Location is written in the upstream's own namespace ("/cam1/..."),
        # so it must be mapped back into ours or the browser leaves /hls/.
        proxy_redirect / /hls/;
        # The session cookie is issued with Path=/cam1/... in the upstream's
        # namespace. The browser is on /hls/cam1/..., so without this rewrite it
        # never sends the cookie back and every segment fails with an auth error.
        proxy_cookie_path / /hls/;
        # MediaMTX marks its session cookies Secure + SameSite=None, which a
        # browser will only accept over HTTPS. This stack serves plain http on
        # :80, so the browser silently drops them and playback loops on the
        # cookie-check redirect. Strip the flag for local http; when TLS lands
        # in Phase 10 this line can go.
        proxy_cookie_flags ~ nosecure samesite=lax;
        proxy_buffering off;
        add_header Cache-Control "no-cache" always;
    }

    # ---- WebRTC / WHEP signalling (Phase 6) ----
    location ^~ /whep/ {
        rewrite ^/whep/(.*)$ /$1 break;
        proxy_pass http://$whep_upstream;
        proxy_cookie_flags ~ nosecure samesite=lax;
        proxy_buffering off;
    }

    # ---- the hand-written Phase 3-8 pages, kept while the Vue app is ported.
    # Reachable at /legacy/alerts.html and so on. Delete this block and the
    # web/html mount once nothing needs them. ----
    location ^~ /legacy/ {
        alias /usr/share/nginx/legacy/;
        index index.html;
    }

    # ---- static assets: cache aggressively ----
    # Vite fingerprints its filenames (index-B7XExLia.js), so a long expiry is
    # safe: a rebuild produces a new name rather than a stale cached file.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/app;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- the Vue app, plus its SPA fallback ----
    # try_files ... /index.html is what makes a refresh on /alerts work.
    # Routing happens in the browser, so the server has no file at that path
    # and would otherwise return 404 - the classic first bug with a built SPA.
    location / {
        root  /usr/share/nginx/app;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
