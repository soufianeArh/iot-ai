# Mounted at /etc/nginx/conf.d/default.conf
# Only the server block: the base image already provides the http{} wrapper.
# map{} has to live in that same http{} context, not inside server{}, which
# works because this whole file is spliced in at the include point.

# This nginx never terminates TLS itself, so its own $scheme is always
# "http", even behind a TLS-terminating proxy like a Cloudflare Tunnel.
# Trusting X-Forwarded-Proto from whatever sits in front, never from the
# client directly, recovers the real scheme; with nothing in front the
# header is simply absent and this falls back to nginx's own http view.
map $http_x_forwarded_proto $external_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name localhost;

    # Gates every location below, since auth_basic is inherited by nested
    # location blocks unless one overrides it (none here do). The password
    # file itself is never committed, it's a secret generated per deploy,
    # same as .env.
    auth_basic           "soufiane-easy";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Docker's healthcheck has no credentials to send, so without this
    # override every check 401s and the container shows unhealthy while
    # actually serving fine. Not proxied to any app service, this only
    # proves nginx itself is up.
    location = /healthz {
        auth_basic off;
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }

    # ---- shared proxy headers (see EasyAIoT WEB/conf/nginx.edge.conf:50-57) ----
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $external_scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    client_max_body_size 20M;

    # Docker's embedded DNS. Without this, nginx resolves upstream names ONCE at
    # startup and caches the IP forever -> 502 after any container is recreated.
    # Pairing it with a variable in proxy_pass defers resolution to request time.
    # (EasyAIoT does the same: WEB/conf/nginx.edge.conf:71 and :346)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $device_upstream device-service:8080;
    set $video_upstream  video-service:6000;
    set $hls_upstream    mediamtx:8888;
    set $whep_upstream   mediamtx:8889;
    set $ai_upstream     ai-service:7000;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # ---- API: no trailing slash on proxy_pass, so /api/devices stays /api/devices ----
    location ^~ /api/ {
        proxy_pass http://$device_upstream;
    }

    # ---- Actuator (health/info) ----
    location ^~ /actuator/ {
        proxy_pass http://$device_upstream;
    }

    # ---- Python video-service (Phase 5) ----
    location ^~ /video/ {
        proxy_pass http://$video_upstream;
    }

    # ---- Python ai-service (Phase 7) ----
    location ^~ /ai/ {
        proxy_pass http://$ai_upstream;
        # Inference calls can be slow, so don't cut them off at the default
        # 60s. Kept above LLM_TIMEOUT_SECONDS' own ceiling (120s by default)
        # so ai-service's own clean timeout error fires first instead of a
        # bare nginx 504.
        proxy_read_timeout 320s;
    }

    # ---- annotated frames written by ai-service ----
    # Served straight off the shared volume: nginx handles the bytes, Python
    # never touches them, the same split used for video.
    location ^~ /snapshots/ {
        alias /usr/share/nginx/snapshots/;
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- HLS playback (Phase 6) ----
    # The .m3u8 playlist is rewritten every second; caching it breaks playback.
    location ^~ /hls/ {
        # A trailing slash on proxy_pass normally strips the matched prefix -
        # but that does NOT happen when proxy_pass contains a variable. With a
        # variable the original URI is passed through untouched, so the prefix
        # must be removed explicitly with rewrite.
        rewrite ^/hls/(.*)$ /$1 break;
        proxy_pass http://$hls_upstream;
        # MediaMTX answers the first request with a 302 to set a session cookie.
        # That Location is written in the upstream's own namespace ("/cam1/..."),
        # so it must be mapped back into ours or the browser leaves /hls/.
        # Scheme forced explicitly, since nginx's own $scheme is always
        # "http" here and a bare "/hls/" redirect would build an http URL
        # even behind a TLS-terminating proxy, which the browser then blocks
        # as mixed content. See the $external_scheme map at the top.
        proxy_redirect / $external_scheme://$host/hls/;
        # The session cookie is issued with Path=/cam1/... in the upstream's
        # namespace. The browser is on /hls/cam1/..., so without this rewrite it
        # never sends the cookie back and every segment fails with an auth error.
        proxy_cookie_path / /hls/;
        # MediaMTX marks its session cookies Secure + SameSite=None, which
        # only works over HTTPS. This stack serves plain http, so without
        # stripping the flag the browser drops the cookie and playback loops
        # forever.
        proxy_cookie_flags ~ nosecure samesite=lax;
        proxy_buffering off;
        add_header Cache-Control "no-cache" always;
    }

    # ---- WebRTC / WHEP signalling (Phase 6) ----
    location ^~ /whep/ {
        rewrite ^/whep/(.*)$ /$1 break;
        proxy_pass http://$whep_upstream;
        proxy_cookie_flags ~ nosecure samesite=lax;
        proxy_buffering off;
    }

    # ---- the hand-written Phase 3-8 pages, kept while the Vue app is ported.
    # Reachable at /legacy/alerts.html and so on. Delete this block and the
    # web/html mount once nothing needs them. ----
    location ^~ /legacy/ {
        alias /usr/share/nginx/legacy/;
        index index.html;
    }

    # ---- static assets: cache aggressively ----
    # Vite fingerprints its filenames (index-B7XExLia.js), so a long expiry is
    # safe: a rebuild produces a new name rather than a stale cached file.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/app;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- the Vue app, plus its SPA fallback ----
    # try_files ... /index.html is what makes a refresh on /alerts work,
    # since routing happens in the browser and the server has no file at
    # that path otherwise.
    location / {
        root  /usr/share/nginx/app;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
