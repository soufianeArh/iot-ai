# Mounted at /etc/nginx/conf.d/default.conf. The base image supplies the
# http{} wrapper, this file is only the server block plus one map{}.

# nginx never terminates TLS itself, so $scheme is always "http" here even
# behind a TLS proxy like a Cloudflare Tunnel. Trust X-Forwarded-Proto from
# whatever sits in front instead, falling back to $scheme when it's absent.
map $http_x_forwarded_proto $external_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name localhost;

    # Off for now, a demo tunnel kept hitting basic auth friction with
    # colleagues. Turn back on before this stays up as anything more than
    # a short lived link. auth_basic_user_file is web/conf/.htpasswd,
    # never committed.
    # auth_basic           "soufiane-easy";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # No credentials from Docker's healthcheck, so it needs its own bypass.
    location = /healthz {
        auth_basic off;
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $external_scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    client_max_body_size 20M;

    # Docker's embedded DNS. Without this nginx resolves upstream names once
    # at startup and never again, so a recreated container 502s until nginx
    # itself restarts. A variable in proxy_pass defers resolution to request time.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $device_upstream device-service:8080;
    set $video_upstream  video-service:6000;
    set $hls_upstream    mediamtx:8888;
    set $whep_upstream   mediamtx:8889;
    set $ai_upstream     ai-service:7000;
    set $auth_upstream   auth-service:8080;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # more specific than /api/ below, nginx matches the longest prefix so
    # this wins for anything under /api/auth/ regardless of block order
    location ^~ /api/auth/ {
        proxy_pass http://$auth_upstream;
    }

    location ^~ /api/ {
        proxy_pass http://$device_upstream;
    }

    location ^~ /actuator/ {
        proxy_pass http://$device_upstream;
    }

    location ^~ /video/ {
        proxy_pass http://$video_upstream;
    }

    location ^~ /ai/ {
        proxy_pass http://$ai_upstream;
        # Inference can be slow. Kept above ai-service's own LLM_TIMEOUT_SECONDS
        # ceiling so its clean timeout error fires before a bare nginx 504 does.
        proxy_read_timeout 320s;
    }

    # Annotated frames written by ai-service, served straight off the shared
    # volume, nginx handles the bytes and Python never touches them again.
    location ^~ /snapshots/ {
        alias /usr/share/nginx/snapshots/;
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /hls/ {
        # proxy_pass with a variable doesn't strip the matched prefix, so
        # the rewrite has to do it instead.
        rewrite ^/hls/(.*)$ /$1 break;
        proxy_pass http://$hls_upstream;
        # MediaMTX's session cookie is issued in its own path namespace
        # ("/cam1/..."), and its redirect Location too. Both get remapped
        # into ours below, and the scheme is forced since $scheme is always
        # http here even behind TLS.
        proxy_redirect / $external_scheme://$host/hls/;
        proxy_cookie_path / /hls/;
        # Secure + SameSite=None only works over HTTPS; this stack serves
        # plain http, so the flag gets stripped or the cookie never sticks.
        proxy_cookie_flags ~ nosecure samesite=lax;
        proxy_buffering off;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /whep/ {
        rewrite ^/whep/(.*)$ /$1 break;
        proxy_pass http://$whep_upstream;
        proxy_cookie_flags ~ nosecure samesite=lax;
        proxy_buffering off;
    }

    # Hand-written pages kept while the Vue app is ported, at /legacy/*.html.
    # Delete this block and the web/html mount once nothing needs them.
    location ^~ /legacy/ {
        alias /usr/share/nginx/legacy/;
        index index.html;
    }

    # Vite fingerprints filenames, so caching hard here is safe.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/app;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback: routing happens client side, so a refresh on /alerts
    # has no matching file here without it.
    location / {
        root  /usr/share/nginx/app;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
